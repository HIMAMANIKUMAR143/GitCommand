services:
  postgres:
    image: postgres:16-alpine
    container_name: git_reset_lab_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: git_reset_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d git_reset_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
